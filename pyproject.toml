[project]
name = "context-keeper-mcp"
version = "0.4.0"
description = "MCP server for project context keeping and design blueprints"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=1.0.0,<2.0.0",
    "filelock>=3.13",
]

[project.scripts]
context-keeper-mcp = "context_keeper_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/context_keeper_mcp"]
